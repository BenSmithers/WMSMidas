<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Plotter</title>
    <script src="midas.js"></script>
    <script src="mhttpd.js"></script>
    <script src="obsolete.js"></script>
    <link href="midas.css" rel="stylesheet">
    <link href="overrides.css" rel="stylesheet">

<style>
  .control-panel {
    display: flex;
    gap: 20px;
    margin: 20px;
    padding: 20px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #f9f9f9;
    max-width: 1400px;
  }

  .panel-section {
    display: grid;
    background: #fff;
    border-radius: 10px;
    padding: 15px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }

  h3 {
    margin-top: 0;
    font-size: 1.1em;
    border-bottom: 1px solid #eee;
    padding-bottom: 5px;
  }

  .readout {
    font-size: 1em;
    margin: 8px 0;
  }

  .value {
    font-weight: bold;
    color: #333;
  }

  .status-item {
    display: flex;
    align-items: center;
    margin: 8px 0;
    font-size: 1em;
  }

  .status-circle {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    margin-left: 8px;
    box-shadow: 0 0 3px rgba(0,0,0,0.2);
    background: gray; /* default */
  }
  .green { background: #2ecc71; }
  .red { background: #e74c3c; }

  label {
    display: block;
    margin: 6px 0;
    font-size: 0.95em;
  }.data {
    display: none;
}
.data.visible {
    display: block;
}
#tabs {
    margin: auto;
    text-align: center;
}
#tabs .tab {
    margin: .5em 0;
    border-radius: 0;
    border: 1px solid rgb(160,160,160);
    background-color: white;
    border-left: none;
    font-size: 16px;
    transition: .5s;
    padding: .1em .4em;
}
#tabs .tab.selected {
    background-color: rgb(208, 224, 224);   
    transition: .5s;
}
#tabs .tab:hover {
    background-color: #e1f2f2;
}
#tabs .tab:first-child {
    border-left: 1px solid rgb(160,160,160);
    border-radius: 5px 0 0 5px;
}
#tabs .tab:last-child {
    border-radius: 0 5px 5px 0;
}
#tabs .tab:disabled {
    background-color: rgb(221, 221, 221);
    transition: .5s;
}
#tabs .tab.selected:disabled {
    background-color: rgb(221, 221, 221);
}

.data table {
    margin: auto;
}
.data td {
    text-align: right;
}


  .img-wrap { margin-top:12px; }

    
</style>

</head>

<body class="mcss" onload="mhttpd_init('Plotter')">

<div id="mheader"></div>
<div id="msidenav"></div>
<div id="mmain">
    <div class="control-panel">
        <div class="panel-section">
        <div class="readout"><input type="checkbox" id="rawbutton" checked=true onchange="boxchange()">Show Relative </input></div>
        <div class="readout"><input type="number" id="maxval" value=0.1 step='0.01' onchange="rangechange()">Set Max </input></div>
        <div class="readout"><input type="number" id="minval" value=-0.1 step='0.01' onchange="rangechange()">Set Min </input></div>
        <div class="readout"><input type="number" id="timerange" value=1 step='0.25' onchange="timechange()">Time Range [hrs] </input></div>
        </div>
        <div class="panel-section">
            <img id="statusImage" src="example.png" alt="Current values" style="max-width:75%;border:1px solid #ccc;border-radius:6px"/> 
        </div>
    </div>
    
</div>
<script type="text/javascript">
    var updateTimerId = 0;
    var updatePeriod = 15000; // 10000; // in msec

    function boxchange(){
        var is_press = document.getElementById("rawbutton").checked
        ODBSet("/Equipment/Automator/Settings/plot_relative", is_press)

        if(document.getElementById("rawbutton").checked){
        mjsonrpc_db_get_values(["/Equipment/Automator/Settings/plot_ranges_rel"]).then(function (rpc){
            var status = rpc.result.status;
            var slow = rpc.result.data[0];
            document.getElementById("minval").value = slow[0].toFixed(2)
            document.getElementById("maxval").value = slow[1].toFixed(2)
        })
      }else{
        mjsonrpc_db_get_values(["/Equipment/Automator/Settings/plot_ranges"]).then(function (rpc){
            var status = rpc.result.status;
            var slow = rpc.result.data[0];
            document.getElementById("minval").value = slow[0].toFixed(2)
            document.getElementById("maxval").value = slow[1].toFixed(2)
        })
      }
    } 
    
    function rangechange(){
      if(document.getElementById("rawbutton").checked){
        ODBSet("/Equipment/Automator/Settings/plot_ranges_rel[0]", document.getElementById("minval").value)
        ODBSet("/Equipment/Automator/Settings/plot_ranges_rel[1]", document.getElementById("maxval").value)
      }else{
        ODBSet("/Equipment/Automator/Settings/plot_ranges[0]", document.getElementById("minval").value)
        ODBSet("/Equipment/Automator/Settings/plot_ranges[1]", document.getElementById("maxval").value)
      }
    }

    function timechange(){
      ODBSet("/Equipment/Automator/Settings/plot_time", document.getElementById("timerange").value)
    }

    function update(){
        clearTimeout(updateTimerId);
        console.log("loaded")
        updateTimerId = setTimeout('update()', updatePeriod);

        document.getElementById("statusImage").src = "example.png" +"?_ts" + Date.now();
    }
    function preload(){
        
      mjsonrpc_db_get_values(["/Equipment/Automator/Settings/plot_time"]).then(function (rpc){
          var status = rpc.result.status;
          var slow = rpc.result.data[0];
          document.getElementById("timerange").value = slow
      })

      mjsonrpc_db_get_values(["/Equipment/Automator/Settings/plot_relative"]).then(function (rpc){
          var status = rpc.result.status;
          var slow = rpc.result.data[0];
          if(slow){
            document.getElementById("rawbutton").checked = true 
          }else{
            document.getElementById("rawbutton").checked = false 
          }
            
      })

      if(document.getElementById("rawbutton").checked){
        mjsonrpc_db_get_values(["/Equipment/Automator/Settings/plot_ranges_rel"]).then(function (rpc){
            var status = rpc.result.status;
            var slow = rpc.result.data[0];
            document.getElementById("minval").value = slow[0].toFixed(2)
            document.getElementById("maxval").value = slow[1].toFixed(2)
        })
      }else{
        mjsonrpc_db_get_values(["/Equipment/Automator/Settings/plot_ranges"]).then(function (rpc){
            var status = rpc.result.status;
            var slow = rpc.result.data[0];
            document.getElementById("minval").value = slow[0].toFixed(2)
            document.getElementById("maxval").value = slow[1].toFixed(2)
        })
      }
    }
    preload()
    update()
    
</script>

</body>
</html>
